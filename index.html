<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vine & Vector Scrapbook</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff7f2;
  overflow-x: hidden;
}

/* paper background */
.paper {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(#eaeaea 1px, transparent 1px),
    linear-gradient(90deg, #eaeaea 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: 0.6;
  z-index: 0;
}

/* header */
.header {
  position: relative;
  padding: 20px;
  z-index: 2;
}

h1 {
  margin: 0;
  font-size: 32px;
}

p {
  margin: 4px 0 0;
  opacity: 0.6;
}

/* sticky notes */
.note {
  position: absolute;
  width: 240px;
  padding: 14px;
  border-radius: 16px;
  box-shadow: 6px 6px 0 rgba(0,0,0,0.1);
  cursor: grab;
  z-index: 2;
  user-select: none;
}

.note:active {
  cursor: grabbing;
}

.title {
  font-weight: bold;
  margin-bottom: 8px;
}

.link {
  display: inline-block;
  font-size: 12px;
  margin: 3px;
  padding: 4px 8px;
  background: rgba(255,255,255,0.8);
  border-radius: 10px;
  text-decoration: none;
  color: #333;
}

/* cute pin */
.pin {
  position: absolute;
  top: -10px;
  left: 10px;
}
</style>
</head>

<body>

<div class="paper"></div>

<div class="header">
  <h1>📒 Vine & Vector</h1>
  <p>your creative scrapbook hub</p>
</div>

<!-- NOTE 1 -->
<div class="note" style="top:120px; left:80px; background:#cfe8ff;" onmousedown="drag(event)">
  <div class="pin">📌</div>
  <div class="title">🌐 Generative AI</div>
  <a class="link" href="https://firefly.adobe.com" target="_blank">Firefly</a>
  <a class="link" href="https://runwayml.com" target="_blank">Runway</a>
  <a class="link" href="https://pika.art" target="_blank">Pika</a>
</div>

<!-- NOTE 2 -->
<div class="note" style="top:200px; left:420px; background:#ffd6e7;" onmousedown="drag(event)">
  <div class="pin">📌</div>
  <div class="title">🎨 Design</div>
  <a class="link" href="https://unsplash.com" target="_blank">Unsplash</a>
  <a class="link" href="https://figma.com" target="_blank">Figma</a>
  <a class="link" href="https://bpando.org" target="_blank">BP&O</a>
</div>

<script>
let active = null;
let offsetX = 0;
let offsetY = 0;

function drag(e) {
  active = e.currentTarget;
  offsetX = e.clientX - active.offsetLeft;
  offsetY = e.clientY - active.offsetTop;

  document.onmousemove = move;
  document.onmouseup = stop;
}

function move(e) {
  if (!active) return;
  active.style.left = (e.clientX - offsetX) + "px";
  active.style.top = (e.clientY - offsetY) + "px";
}

function stop() {
  active = null;
  document.onmousemove = null;
  document.onmouseup = null;
}
</script>

</body>
</html>
